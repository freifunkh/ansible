---

- name: Add gpg dependency for key handling
  ansible.builtin.apt:
    name: "gpg"

- name: Add Zabbix Repo Key
  ansible.builtin.get_url:
    url: "https://repo.zabbix.com/zabbix-official-repo.key"
    dest: "/etc/apt/keyrings/zabbix-official-repo.key"
    mode: "0644"
    owner: "root"
    group: "root"
  when: "not ansible_check_mode"

- name: Configure Zabbix APT repository
  ansible.builtin.deb822_repository:
    name: "zabbix"
    types: "deb"
    uris: "https://repo.zabbix.com/zabbix/{{ zabbix_server_version | default('7.0') }}/debian"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "main"
    signed_by: "/etc/apt/keyrings/zabbix-official-repo.key"
    state: "present"

- name: Install Zabbix Webfrontend (via apt)
  ansible.builtin.apt:
    update_cache: true
    name: "zabbix-frontend-php"

- name: Determine current php version
  ansible.builtin.shell: "find /etc/php/ -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort -nr | head -1"
  register: "php_location"
  check_mode: false
  changed_when: false

- name: PHP Timezone setting
  notify: "Reload nginx"
  ansible.builtin.lineinfile:
    dest: "/etc/php/{{ php_location.stdout | default('undef') }}/fpm/php.ini"
    regexp: "date.timezone ="
    line: "date.timezone = Europe/Berlin"

- name: PHP post_max_size setting
  notify: "Reload nginx"
  ansible.builtin.lineinfile:
    dest: "/etc/php/{{ php_location.stdout | default('undef') }}/fpm/php.ini"
    regexp: "post_max_size ="
    line: "post_max_size = 16M"

- name: PHP max_execution_time setting
  notify: "Reload nginx"
  ansible.builtin.lineinfile:
    dest: "/etc/php/{{ php_location.stdout | default('undef') }}/fpm/php.ini"
    regexp: "max_execution_time ="
    line: "max_execution_time = 300"

- name: PHP max_input_time setting
  notify: "Reload nginx"
  ansible.builtin.lineinfile:
    dest: "/etc/php/{{ php_location.stdout | default('undef') }}/fpm/php.ini"
    regexp: "max_input_time ="
    line: "max_input_time = 300"
