---

- name: Add gpg dependency for key handling
  ansible.builtin.apt:
    name: "gpg"

- name: Add Zabbix Repo Key
  ansible.builtin.get_url:
    url: "https://repo.zabbix.com/zabbix-official-repo.key"
    dest: "/etc/apt/keyrings/zabbix-official-repo.key"
    mode: "0644"
    owner: "root"
    group: "root"
  when: "not ansible_check_mode"

- name: Configure Zabbix APT repository
  ansible.builtin.deb822_repository:
    name: "zabbix"
    types: "deb"
    uris: "https://repo.zabbix.com/zabbix/{{ zabbix_server_version | default('7.0') }}/debian"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "main"
    signed_by: "/etc/apt/keyrings/zabbix-official-repo.key"
    state: "present"

- name: Install Zabbix Server
  ansible.builtin.apt:
    update_cache: true
    name: "zabbix-server-mysql"

- name: Deploy zabbix-server config
  notify: "restart zabbix-server"
  ansible.builtin.template:
    src: "zabbix_server.conf.j2"
    dest: "/etc/zabbix/zabbix_server.conf"

- name: Enable Zabbix Server on bootup
  ansible.builtin.systemd_service:
    name: "zabbix-server"
    enabled: true
    state: "started"

- name: Firewalling
  include_tasks: "firewall.yml"
