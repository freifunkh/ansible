---

- name: Install https for apt
  ansible.builtin.apt:
    name: "apt-transport-https"
    update_cache: true

- name: Add grafana repository key
  ansible.builtin.get_url:
    url: "https://apt.grafana.com/gpg.key"
    dest: "/usr/share/keyrings/grafana.key"
    mode: "0644"
    owner: "root"
    group: "root"

- name: Add grafana repositories
  register: "grafanarepo"
  ansible.builtin.deb822_repository:
    name: "grafana"
    types: "deb"
    uris: "https://apt.grafana.com"
    suites: "stable"
    components: "main"
    signed_by: "/usr/share/keyrings/grafana.key"

- name: Update apt chache to get grafana packages
  when: "grafanarepo is changed"
  ansible.builtin.apt:
    update_cache: true

- name: Install grafana
  ansible.builtin.apt:
    name: "grafana"

- name: Generate grafana config (DIFF REDACTED)
  notify: "Restart grafana"
  ansible.builtin.template:
    src: "grafana.ini.j2"
    dest: "/etc/grafana/grafana.ini"
  diff: "{{ show_secret_diffs }}"

- name: Install/update grafana plugins
  notify: "Restart grafana"
  community.grafana.grafana_plugin:
    name: "{{ item }}"
    version: "latest"
    state: "present"
    grafana_plugins_dir: "{{ grafana_datadir }}/plugins"
  loop:
    - "blackmirror1-singlestat-math-panel"
    - "grafana-piechart-panel"
    - "jdbranham-diagram-panel"
    - "michaeldmoore-scatter-panel"
    - "natel-plotly-panel"
    # - "alexanderzobnin-zabbix-app"
    # - "marcusolsson-dynamictext-panel"
    # - "marcusolsson-json-datasource"
    # - "vonage-status-panel"
    # - "grafana-image-renderer"

- name: Permissions on data directory
  ansible.builtin.file:
    state: "directory"
    path: "{{ grafana_datadir }}"
    owner: "grafana"
    group: "grafana"
    recurse: true

- name: Enable grafana
  ansible.builtin.systemd_service:
    name: "grafana-server"
    enabled: true
    state: "started"
