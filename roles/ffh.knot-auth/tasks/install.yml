---

- name: Install dpeendencies
  ansible.builtin.apt:
    pkg:
    - "gpg"

- name: Add Knot repo key
  ansible.builtin.get_url:
    url: "https://pkg.labs.nic.cz/gpg"
    dest: "/etc/apt/keyrings/cznic-labs-pkg.gpg"
    mode: "0644"
    owner: "root"
    group: "root"
  when: "not ansible_check_mode"

- name: Add Knot repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cznic-labs-pkg.gpg] https://pkg.labs.nic.cz/knot-dns {{ ansible_facts['lsb']['codename'] }} main"
    state: "present"
    filename: "knot-dns"

- name: Install Knot
  ansible.builtin.apt:
    name: "knot"
    update_cache: "yes"
  notify: "Restart knot"

- name: Handle firewalling
  include_tasks: "firewall.yml"

- name: Enable Knot service
  ansible.builtin.systemd_service:
    name: "knot"
    enabled: true
