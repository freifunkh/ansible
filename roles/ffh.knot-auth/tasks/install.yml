---

- name: Install dependencies
  ansible.builtin.apt:
    name: "gpg"

- name: Add Knot repo key
  ansible.builtin.get_url:
    url: "https://pkg.labs.nic.cz/gpg"
    dest: "/etc/apt/keyrings/cznic-labs-pkg.gpg"
    mode: "0644"
    owner: "root"
    group: "root"
  when: "not ansible_check_mode"

- name: Add Knot repository
  ansible.builtin.deb822_repository:
    name: "knot-dns"
    types: "deb"
    uris: "https://pkg.labs.nic.cz/knot-dns"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "main"
    signed_by: "/etc/apt/keyrings/cznic-labs-pkg.gpg"
    state: "present"

- name: Install Knot
  notify: "Restart knot"
  ansible.builtin.apt:
    name: "knot"
    update_cache: true

- name: Handle firewalling
  include_tasks: "firewall.yml"

- name: Enable Knot service
  ansible.builtin.systemd_service:
    name: "knot"
    enabled: true
