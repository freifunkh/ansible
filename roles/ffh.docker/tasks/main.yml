---
# tasks file for ffh.docker

- name: Install dependencies
  ansible.builtin.apt:
    pkg:
    - "apt-transport-https"
    - "ca-certificates"
    - "curl"
    - "gnupg"

- name: Add Docker repo key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/debian/gpg"
    dest: "/etc/apt/keyrings/docker.key"
    mode: "0644"
    owner: "root"
    group: "root"
  when: "not ansible_check_mode"

- name: remove
  file:
    path: "/etc/apt/sources.list.d/docker.list"
    state: absent

- name: Add Docker repo
  register: "dockerrepositoryadded"
  ansible.builtin.deb822_repository:
    name: "docker"
    types: "deb"
    uris: "https://download.docker.com/linux/debian"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "stable"
    signed_by: "/etc/apt/keyrings/docker.key"
    state: "present"

- name: Update apt chache to get Docker packages
  ansible.builtin.apt:
    update_cache: true
  when: "dockerrepositoryadded is changed"

- name: Install Docker from repo
  register: "dockerinstall"
  ansible.builtin.apt:
    pkg:
    - "docker-ce"
    - "docker-ce-cli"
    - "containerd.io"

- name: Install daemon.json
  ansible.builtin.template:
    src: "daemon.json.j2"
    dest: "/etc/docker/daemon.json"
  notify: "Restart Docker"

- name: nftables stuff
  include_tasks: "nftables.yml"
  when: "nftables_enabled is defined and nftables_enabled"
