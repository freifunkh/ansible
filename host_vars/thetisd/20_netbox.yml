---

netbox_docker_version: "5.1.2"
netbox_network: "proxy"

netbox_path_home: "/opt/netbox"
netbox_path_media: "/media/docker/netbox/media"
netbox_path_reports: "/media/docker/netbox/reports"
netbox_path_scripts: "/media/docker/netbox/scripts"
netbox_path_postgres: "/media/docker/netbox/postgres.18"
netbox_path_valkey: "/media/docker/netbox/valkey"

netbox_labels:
  traefik.enable: "true"
  traefik.docker.network: "{{ netbox_network }}"
  traefik.http.routers.netbox-https.entrypoints: "websecure"
  traefik.http.routers.netbox-https.rule: "Host(`netbox.ffh.zone`)"
  traefik.http.routers.netbox-https.tls.certresolver: "letsencrypt"
  traefik.http.routers.netbox-https.service: "netbox-https"
  traefik.http.services.netbox-https.loadbalancer.server.port: "8080"
  traefik.http.routers.netbox-http.entrypoints: "web"
  traefik.http.routers.netbox-http.rule: "Host(`netbox.ffh.zone`)"
  traefik.http.routers.netbox-http.middlewares: "netbox"
  traefik.http.middlewares.netbox.redirectscheme.scheme: "https"
netbox_netbox_env:
  DB_PASSWORD: '{{ netbox_db_password }}'
  REDIS_CACHE_PASSWORD: '{{ netbox_redis_cache_password }}'
  REDIS_PASSWORD: '{{ netbox_redis_password }}'
  SECRET_KEY: '{{ netbox_secret_key }}'
  SKIP_SUPERUSER: false
  SUPERUSER_API_TOKEN: ''
  SUPERUSER_EMAIL: 'noc@hannover.freifunk.net'
  SUPERUSER_NAME: 'admin'
  SUPERUSER_PASSWORD: '{{ netbox_superuser_password }}'
  REMOTE_AUTH_BACKEND: 'social_core.backends.open_id_connect.OpenIdConnectAuth'
  SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: 'https://auth.ffh.zone/application/o/netbox'
  SOCIAL_AUTH_OIDC_KEY: '{{ netbox_oidc_key }}'
  SOCIAL_AUTH_OIDC_SECRET: '{{ netbox_oidc_secret }}'
  SOCIAL_AUTH_OIDC_SCOPE: 'openid profile email roles'
  LOGOUT_REDIRECT_URL: 'https://auth.ffh.zone/application/o/netbox/end-session/'
netbox_worker_env:
  DB_PASSWORD: '{{ netbox_db_password }}'
  REDIS_CACHE_PASSWORD: '{{ netbox_redis_cache_password }}'
  REDIS_PASSWORD: '{{ netbox_redis_password }}'
netbox_postgres_env:
  POSTGRES_PASSWORD: '{{ netbox_db_password }}'
netbox_redis_env:
  REDIS_PASSWORD: '{{ netbox_redis_password }}'
netbox_redis_cache_env:
  REDIS_PASSWORD: '{{ netbox_redis_cache_password }}'
